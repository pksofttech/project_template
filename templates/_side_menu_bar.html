<!-- ✅ Responsive Drawer Sidebar -->
<div class="drawer-side z-50">
    <label for="main-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <aside class="bg-base-100 w-64 min-h-screen p-4 flex flex-col justify-between border-r border-base-content/10 shadow-xl">
        <div class="space-y-4">
            <!-- Sidebar Brand Header -->
            <div class="flex items-center gap-3 px-2 py-3 border-b border-base-content/10">
                <div class="w-9 h-9 rounded-xl bg-primary/10 text-primary flex items-center justify-center text-lg">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                    <h2 class="font-bold text-sm tracking-wide">{{ app_name }}</h2>
                    <p class="text-[10px] text-base-content/60">Template Starter Kit</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <ul class="menu menu-md p-0 gap-1">
                <li class="menu-title text-xs font-bold uppercase tracking-wider text-base-content/40 px-2">Main Menu</li>
                <li>
                    <a href="/dashboard" class="{% if active_page == 'dashboard' %}active font-semibold{% endif %}">
                        <i class="fa-solid fa-gauge-high w-5 text-center"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="/sample" class="{% if active_page == 'sample' %}active font-semibold{% endif %}">
                        <i class="fa-solid fa-box-archive w-5 text-center"></i>
                        <span>Sample Items</span>
                    </a>
                </li>

                <li class="menu-title text-xs font-bold uppercase tracking-wider text-base-content/40 px-2 mt-4">System</li>
                <li>
                    <a href="/system_config" class="{% if active_page == 'system_config' %}active font-semibold{% endif %}">
                        <i class="fa-solid fa-sliders w-5 text-center"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li>
                    <a href="/docs" target="_blank">
                        <i class="fa-solid fa-code w-5 text-center"></i>
                        <span>Swagger Docs</span>
                        <span class="badge badge-xs badge-info">API</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- Sidebar Footer Info -->
        <div class="p-3 bg-base-200/50 rounded-xl border border-base-content/5 text-xs text-base-content/60">
            <div class="flex items-center justify-between">
                <span>Status</span>
                <span class="badge badge-success badge-xs gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> Online
                </span>
            </div>
            <div class="mt-2 text-[10px] text-center text-base-content/40">
                PKS Template v{{ version }}
            </div>
        </div>
    </aside>
</div>

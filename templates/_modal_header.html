<div class="flex items-center justify-between w-full px-4 sm:px-5 py-3 bg-linear-to-r from-primary via-primary/95 to-primary text-primary-content select-none border-b border-white/10 shadow-xs">
    <div class="flex items-center gap-3 min-w-0">
        <div class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-box bg-white/15 ring-1 ring-white/25 shadow-2xs shrink-0 text-white">
            <i class="fa-solid fa-layer-group text-sm"></i>
        </div>
        <div class="min-w-0">
            <h3 class="font-bold text-sm sm:text-base text-primary-content tracking-wide truncate drop-shadow-xs" data-field="title">
                {{ modal_title | default('') }}
            </h3>
        </div>
    </div>
    <div class="flex items-center shrink-0">
        <form method="dialog">
            <button class="btn btn-circle btn-xs sm:btn-sm bg-white/15 hover:bg-error text-white hover:text-white border-0 ring-1 ring-white/20 hover:ring-error transition-all duration-200 shadow-2xs" title="Close Window (Esc)">
                <i class="fa-solid fa-xmark text-xs sm:text-sm"></i>
            </button>
        </form>
    </div>
</div>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="google" content="notranslate">
<title>{{ title }} - {{ app_name }}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

<!-- Font Preload for Faster First Contentful Paint -->
<link rel="preload" href="/static/font/Kanit-Regular.ttf" as="font" type="font/ttf" crossorigin />

<!-- Fonts -->
<style>
    @font-face {
        font-family: "Kanit";
        src: url(/static/font/Kanit-Regular.ttf) format("truetype");
        font-display: swap;
    }
    @font-face {
        font-family: "Sarabun";
        src: url(/static/font/Sarabun-Regular.ttf) format("truetype");
        font-display: swap;
    }
    body {
        font-family: "Kanit", "Sarabun", sans-serif;
    }
</style>

<!-- Font Awesome -->
<link href="/static/plugins/fontawasome/css/fontawesome.css" rel="stylesheet" />
<link href="/static/plugins/fontawasome/css/solid.css" rel="stylesheet" />
<link href="/static/plugins/fontawasome/css/regular.css" rel="stylesheet" />
<link href="/static/plugins/fontawasome/css/brands.css" rel="stylesheet" />

<!-- DataTables, Toastr & Plugins -->
<link rel="stylesheet" type="text/css" href="/static/plugins/datatable/datatables.min.css" />
<link rel="stylesheet" href="/static/plugins/toastr/toastr.min.css" />
<link rel="stylesheet" href="/static/plugins/flatpickr/flatpickr.css" />

<!-- DaisyUI v5 & Tailwind CSS v4 Compiled -->
<link rel="stylesheet" href="/static/style.css?v={{ version }}" />

<!-- Universal DaisyUI Modal Dialogs -->

<!-- 1. Alert Modal -->
<dialog id="global_alert_modal" class="modal">
    <div class="modal-box max-w-sm text-center">
        <div id="global_alert_icon" class="text-4xl text-info mb-3">
            <i class="fa-solid fa-circle-info"></i>
        </div>
        <h3 id="global_alert_title" class="font-bold text-lg">Notification</h3>
        <p id="global_alert_msg" class="py-3 text-sm text-base-content/70">Message body</p>
        <div class="modal-action justify-center">
            <button class="btn btn-primary btn-sm px-6" onclick="global_alert_modal.close()">OK</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<!-- 2. Confirm Modal -->
<dialog id="global_confirm_modal" class="modal">
    <div class="modal-box max-w-sm text-center">
        <div class="text-4xl text-warning mb-3">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 id="global_confirm_title" class="font-bold text-lg">Are you sure?</h3>
        <p id="global_confirm_msg" class="py-3 text-sm text-base-content/70">Do you wish to proceed?</p>
        <div class="modal-action justify-center gap-2">
            <button class="btn btn-ghost btn-sm" onclick="global_confirm_modal.close()">Cancel</button>
            <button id="global_confirm_ok_btn" class="btn btn-error btn-sm px-6">Confirm</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<!-- 3. Loading Spinner -->
<dialog id="global_loading_modal" class="modal">
    <div class="modal-box max-w-xs text-center py-8">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p id="global_loading_text" class="mt-4 text-sm font-medium text-base-content/80">Processing, please wait...</p>
    </div>
</dialog>

<script>
    function showAlert(title, message, iconType = "info") {
        document.getElementById("global_alert_title").innerText = title;
        document.getElementById("global_alert_msg").innerText = message;
        const iconEl = document.getElementById("global_alert_icon");
        if (iconType === "success") {
            iconEl.className = "text-4xl text-success mb-3";
            iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        } else if (iconType === "error") {
            iconEl.className = "text-4xl text-error mb-3";
            iconEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
        } else {
            iconEl.className = "text-4xl text-info mb-3";
            iconEl.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
        }
        document.getElementById("global_alert_modal").showModal();
    }

    function showConfirm(title, message, onConfirm) {
        document.getElementById("global_confirm_title").innerText = title;
        document.getElementById("global_confirm_msg").innerText = message;
        const okBtn = document.getElementById("global_confirm_ok_btn");
        okBtn.onclick = function() {
            document.getElementById("global_confirm_modal").close();
            if (typeof onConfirm === "function") onConfirm();
        };
        document.getElementById("global_confirm_modal").showModal();
    }
</script>

<script>
    window.software_packet_feature = window.software_packet_feature || "{{ packet_feature | default('') }}";
    window.software_maturity = window.software_maturity || "{{ maturity | default('') }}";

    // Toastr default options
    if (typeof toastr !== "undefined") {
        toastr.options = {
            closeButton: true,
            progressBar: true,
            positionClass: "toast-bottom-right",
            timeOut: "3000",
        };
    }

    // Connect to Server-Sent Events (SSE)
    if (!!window.EventSource && !window.__appSseSource) {
        const source = new EventSource('/sse');
        window.__appSseSource = source;

        source.addEventListener('connected', function(e) {
            try {
                const initData = JSON.parse(e.data);
                // Connected handshake received
            } catch(err) {}
        });

        source.onmessage = function(e) {
            try {
                const data = JSON.parse(e.data);
                console.log("⚡ SSE Realtime Message:", data);
                window.dispatchEvent(new CustomEvent('sse:message', { detail: data }));
            } catch(err) {
                console.log("⚡ SSE Raw:", e.data);
                window.dispatchEvent(new CustomEvent('sse:message', { detail: e.data }));
            }
        };

        source.onerror = function(err) {
            // Only log if connection was permanently closed (not temporary reconnect)
            if (source.readyState === EventSource.CLOSED) {
                console.warn("⚡ SSE Connection closed.");
            }
        };

        // Cleanly terminate connection on page transition to prevent ghost connections
        window.addEventListener('beforeunload', function() {
            source.close();
        });
        window.addEventListener('pagehide', function() {
            source.close();
        });
    }
</script>

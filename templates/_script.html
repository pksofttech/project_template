<script>
    window.software_packet_feature = window.software_packet_feature || "{{ packet_feature | default('') }}";
    window.software_maturity = window.software_maturity || "{{ maturity | default('') }}";

    // Toastr default options
    if (typeof toastr !== "undefined") {
        toastr.options = {
            closeButton: true,
            progressBar: true,
            positionClass: "toast-bottom-right",
            timeOut: "3000",
        };
    }

    // Connect to Server-Sent Events (SSE)
    if (!!window.EventSource && !window.__appSseSource) {
        const source = new EventSource('/sse');
        window.__appSseSource = source;

        source.addEventListener('connected', function(e) {
            try {
                const initData = JSON.parse(e.data);
                // Connected handshake received
            } catch(err) {}
        });

        source.onmessage = function(e) {
            try {
                const data = JSON.parse(e.data);
                console.log("⚡ SSE Realtime Message:", data);
                window.dispatchEvent(new CustomEvent('sse:message', { detail: data }));
            } catch(err) {
                console.log("⚡ SSE Raw:", e.data);
                window.dispatchEvent(new CustomEvent('sse:message', { detail: e.data }));
            }
        };

        source.addEventListener('emergency_event', function(e) {
            try {
                const data = JSON.parse(e.data);
                console.warn("🚨 Global Emergency SSE Event:", data);
                window.dispatchEvent(new CustomEvent('sse:emergency', { detail: data }));
                updateGlobalEmergencyNavbar(data);
            } catch(err) {}
        });

        // Global Navbar Updater Function
        function updateGlobalEmergencyNavbar(state) {
            const navPill = document.getElementById('globalEmergencyNavbarPill');
            const navText = document.getElementById('globalEmergencyNavbarText');
            const navIcon = document.getElementById('globalEmergencyNavbarIcon');
            const navLink = document.getElementById('globalEmergencyNavbarLink');
            if (!navPill) return;

            if (state && state.mode === 'FIRE_ALARM') {
                navPill.classList.remove('hidden');
                if (navLink) navLink.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold border border-error bg-error text-white animate-pulse shadow-sm";
                if (navIcon) navIcon.className = "fa-solid fa-fire-flame-curved";
                if (navText) navText.textContent = "FIRE ALARM";
            } else if (state && state.mode === 'GLOBAL_LOCKDOWN') {
                navPill.classList.remove('hidden');
                if (navLink) navLink.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold border border-warning bg-warning text-warning-content animate-pulse shadow-sm";
                if (navIcon) navIcon.className = "fa-solid fa-lock";
                if (navText) navText.textContent = "LOCKDOWN";
            } else {
                navPill.classList.add('hidden');
            }
        }
        window.updateGlobalEmergencyNavbar = updateGlobalEmergencyNavbar;

        // Initial emergency check on page load
        fetch('/api/access/emergency/status')
            .then(r => r.json())
            .then(d => updateGlobalEmergencyNavbar(d))
            .catch(() => {});

        source.onerror = function(err) {
            // Only log if connection was permanently closed (not temporary reconnect)
            if (source.readyState === EventSource.CLOSED) {
                console.warn("⚡ SSE Connection closed.");
            }
        };

        // Cleanly terminate connection on page transition to prevent ghost connections
        window.addEventListener('beforeunload', function() {
            source.close();
        });
        window.addEventListener('pagehide', function() {
            source.close();
        });
    }
</script>
